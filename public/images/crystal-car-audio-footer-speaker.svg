<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" fill="none" role="img" aria-label="Animated angled subwoofer with pulsing bass and sound waves">
<defs>
 <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#51575a"/><stop offset=".35" stop-color="#14191b"/><stop offset=".75" stop-color="#303638"/><stop offset="1" stop-color="#080b0c"/></linearGradient>
 <linearGradient id="cone" x1="0" y1="0" x2="1" y2=".85"><stop stop-color="#38a49a"/><stop offset=".45" stop-color="#0c6661"/><stop offset="1" stop-color="#053e3b"/></linearGradient>
 <radialGradient id="cap" cx=".35" cy=".3" r=".85"><stop stop-color="#424a4b"/><stop offset=".55" stop-color="#202627"/><stop offset="1" stop-color="#090d0e"/></radialGradient>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="13"/></filter>
</defs>
<!-- waves radiate from the speaker, with transparent canvas -->
<g transform="translate(340 350) rotate(-24)">
 <g stroke="#0c6661" stroke-width="5" opacity="0">
  <ellipse rx="225" ry="270"><animate attributeName="rx" values="225;390" dur="2.5s" repeatCount="indefinite"/><animate attributeName="ry" values="270;440" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".48;0" dur="2.5s" repeatCount="indefinite"/></ellipse>
  <ellipse rx="225" ry="270"><animate attributeName="rx" values="225;390" dur="2.5s" begin="-.85s" repeatCount="indefinite"/><animate attributeName="ry" values="270;440" dur="2.5s" begin="-.85s" repeatCount="indefinite"/><animate attributeName="opacity" values=".48;0" dur="2.5s" begin="-.85s" repeatCount="indefinite"/></ellipse>
  <ellipse rx="225" ry="270"><animate attributeName="rx" values="225;390" dur="2.5s" begin="-1.7s" repeatCount="indefinite"/><animate attributeName="ry" values="270;440" dur="2.5s" begin="-1.7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".48;0" dur="2.5s" begin="-1.7s" repeatCount="indefinite"/></ellipse>
 </g>
</g>
<!-- tilted three-dimensional woofer -->
<g transform="translate(342 350) rotate(-24) skewY(7)">
 <ellipse cx="-34" cy="32" rx="222" ry="271" fill="#000" opacity=".24" filter="url(#shadow)"/>
 <ellipse cx="-52" cy="35" rx="195" ry="244" fill="#0a0d0e" stroke="#333a3c" stroke-width="15"/>
 <path d="M-205 -155 Q-270 0 -207 169 L-155 195 Q-216 0 -157 -183Z" fill="#111718" stroke="#333a3b" stroke-width="5"/>
 <ellipse rx="221" ry="267" fill="url(#rim)" stroke="#0a0d0e" stroke-width="8"/>
 <ellipse rx="190" ry="234" fill="#0c1011" stroke="#3a4041" stroke-width="6"/>
 <ellipse rx="173" ry="215" fill="#111718" stroke="#070909" stroke-width="14"/>
 <g><ellipse rx="150" ry="188" fill="url(#cone)" stroke="#242b2c" stroke-width="8"/>
 <ellipse rx="144" ry="181" stroke="#69b6ad" stroke-width="2" opacity=".35"/>
 <g><animateTransform attributeName="transform" type="scale" values="1 1;1.035 1.035;.985 .985;1 1" dur=".54s" repeatCount="indefinite"/>
 <ellipse rx="88" ry="111" fill="#0c1011" opacity=".35"/>
 <ellipse rx="83" ry="105" fill="url(#cap)" stroke="#101718" stroke-width="8"/>
 <ellipse cx="-16" cy="-24" rx="47" ry="63" fill="#626d6c" opacity=".10"/>
 </g></g>
 <g fill="#070a0b" stroke="#4a5252" stroke-width="2"><circle cx="0" cy="-247" r="8"/><circle cx="0" cy="247" r="8"/><circle cx="-205" cy="0" r="8"/><circle cx="205" cy="0" r="8"/><circle cx="-143" cy="-177" r="8"/><circle cx="143" cy="177" r="8"/><circle cx="143" cy="-177" r="8"/><circle cx="-143" cy="177" r="8"/></g>
</g>
<style>@media (prefers-reduced-motion: reduce){animate,animateTransform{display:none}}</style>
</svg>
